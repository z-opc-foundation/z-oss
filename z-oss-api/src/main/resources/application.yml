server:
  port: 8082

spring:
  application:
    name: z-oss
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      # 对象存储的上传默认卡在 1MB，传个稍大的附件就 413。放到 200MB ——
      # 真要传更大的走分片接口，单片本来就该控制在这个量级。
      max-file-size: 200MB
      max-request-size: 200MB
      # 不落临时目录：分片接口的流直接进 provider，落盘只会多占一份空间
      # （FileStorageEngine 自己已经边读边写目标文件，不需要再缓存一份）
      file-size-threshold: 0B
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com:3306/oc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: zifang
    password: ${SPRING_DATASOURCE_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        # 显式写死：K8s 的 readinessProbe/livenessProbe 打在 /actuator/health 上，
        # 靠"Spring Boot 默认恰好暴露 health"的话，父链一改默认值探针就红。
        include: health,info
  endpoint:
    health:
      show-details: never

# z-base-db 配置
z:
  base:
    db:
      default:
        host: rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com
        port: 3306
        username: zifang
        password: ${Z_BASE_DB_DEFAULT_PASSWORD:}
        database: oc
      oss:
        database: oc

# 本地后端的对象落盘根目录。K8s 侧用 PVC 挂载到这里，
# 不覆盖的话容器一重建对象全丢 —— 数据面和元数据库是分开的两件事。
oss:
  storage:
    file:
      root: ${OSS_STORAGE_FILE_ROOT:/data/oss}
  # 预签名 URL 的签发密钥。留空会 WARN 并退回内置默认密钥（仅限本地开发）。
  local:
    access-key: ${OSS_LOCAL_ACCESS_KEY:}
    # 容器外访问要用 NodePort / 域名，容器内的 localhost 拼出来的 URL 客户端取不到
    public-base-url: ${OSS_LOCAL_PUBLIC_BASE_URL:}

# z-ctc-sso 的 SsoAutoConfiguration 默认把拦截器挂在 /** 上，会在
# AuthenticationInterceptor 之前把 /api/v1/** 全判成"未登录"。
# 但对象存储的数据面是 AK/SK 鉴权（客户端是 SDK/curl，不是浏览器），
# 没有也不该有 sso_token —— 所以整条数据面从 SSO 拦截里排除，
# 只保留 /api/oss-admin 走 SSO（那是真·控制台，靠 SsoContext 记审计操作人）。
sso:
  exclude-paths:
    - /api/v1/**
    - /actuator/**
    # Spring Boot 的错误页。不排除的话，任何 404/500 转发到 /error 后会被 SsoInterceptor
    # 当成"未登录的浏览器请求"，回一个 302 跳登录 —— 表现为"接口路径拼错"却看到登录页，
    # 排查时完全看不出真实原因（实测 /api/v1/buckets 打错单复数就是这样查了半天）。
    - /error
    # 控制台自己的页面与静态资源。z-oss 的控制台不用 sso_token 登录，它有独立的
    # 用户体系（POST /api/v1/user/login，token 就是 accessKey:secretKey），
    # 页面由前端自己判是否跳 /z-oss/login。让 SSO 拦这些路径只会得到死循环：
    # 未登录 → 302 到 ctc → 回来仍是未登录，控制台一屏都打不开。
    - /
    - /index.html
    - /assets/**
    - /icon.png
    - /favicon.ico
    - /dashboard
    - /buckets
    - /users
    - /objects/**
    - /z-oss/**
