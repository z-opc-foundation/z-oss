server:
  port: 8082

spring:
  application:
    name: z-oss
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  servlet:
    multipart:
      # 对象存储的上传默认卡在 1MB，传个稍大的附件就 413。放到 200MB ——
      # 真要传更大的走分片接口，单片本来就该控制在这个量级。
      max-file-size: 200MB
      max-request-size: 200MB
      # 不落临时目录：分片接口的流直接进 provider，落盘只会多占一份空间
      # （FileStorageEngine 自己已经边读边写目标文件，不需要再缓存一份）
      file-size-threshold: 0B
  datasource:
    type: com.alibaba.druid.pool.DruidDataSource
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com:3306/oc?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: zifang
    password: ${SPRING_DATASOURCE_PASSWORD:}
    druid:
      initial-size: 5
      min-idle: 5
      max-active: 20

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

management:
  endpoints:
    web:
      exposure:
        # 显式写死：K8s 的 readinessProbe/livenessProbe 打在 /actuator/health 上，
        # 靠"Spring Boot 默认恰好暴露 health"的话，父链一改默认值探针就红。
        include: health,info
  endpoint:
    health:
      show-details: never

# z-base-db 配置
z:
  base:
    db:
      default:
        host: rm-bp108uqlgwn712k54ho.mysql.rds.aliyuncs.com
        port: 3306
        username: zifang
        password: ${Z_BASE_DB_DEFAULT_PASSWORD:}
        database: oc
      oss:
        database: oc

# 本地后端的对象落盘根目录。K8s 侧用 PVC 挂载到这里，
# 不覆盖的话容器一重建对象全丢 —— 数据面和元数据库是分开的两件事。
oss:
  storage:
    file:
      root: ${OSS_STORAGE_FILE_ROOT:/data/oss}
  # 预签名 URL 的签发密钥。留空会 WARN 并退回内置默认密钥（仅限本地开发）。
  local:
    access-key: ${OSS_LOCAL_ACCESS_KEY:}
    # 容器外访问要用 NodePort / 域名，容器内的 localhost 拼出来的 URL 客户端取不到
    public-base-url: ${OSS_LOCAL_PUBLIC_BASE_URL:}
